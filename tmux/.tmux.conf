# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'Nybkox/tmux-kanagawa'

# kanagawa-plugins
set -g @kanagawa-plugins "git"
set -g @kanagawa-show-left-icon session


# Linux only
set -g mouse on
set -g set-clipboard on
set-option -sa terminal-overrides ',st-256color:RGB'
set -g set-titles on
set -g automatic-rename on
set -g set-titles-string '#S:#W'
set -g update-environment "WAYLAND_DISPLAY XDG_RUNTIME_DIR HYPRLAND_INSTANCE_SIGNATURE"

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on       # renumber all windows when any window is closed
set -g status-position top       # macOS / darwin style

set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/.dotfiles'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-window-mode 'on'

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down


# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'M-h' previous-window
bind-key -n 'M-l' next-window
bind-key -n 'C-f' send-keys C-f

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# Reshape live sessions between the two layouts tmux-sessionizer builds:
# docked = one window of three side-by-side panes, laptop = three windows.
# M-r follows the connected displays; M-d and M-l force one or the other.
bind-key M-r run-shell "~/.local/scripts/tmux-layout-profile auto"
bind-key M-d run-shell "~/.local/scripts/tmux-layout-profile panes"
bind-key M-l run-shell "~/.local/scripts/tmux-layout-profile windows"

# Worktree picker popup (replaces the default choose-tree on w): pane's repo,
# or pick one from the nearest .wt-dash. Enter opens, Alt-c creates, Alt-x removes.
bind-key w display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "~/.local/scripts/wt-pick"

# Faster resize pane with arrow keys
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5

# To copy, left click and drag to highlight text in yellow, 
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "sh -c 'if command -v wl-copy >/dev/null 2>&1; then WAYLAND_DISPLAY=\${WAYLAND_DISPLAY:-wayland-1} XDG_RUNTIME_DIR=\${XDG_RUNTIME_DIR:-/run/user/1000} wl-copy; else xclip -selection clipboard; fi'"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "sh -c 'if command -v wl-copy >/dev/null 2>&1; then WAYLAND_DISPLAY=\${WAYLAND_DISPLAY:-wayland-1} XDG_RUNTIME_DIR=\${XDG_RUNTIME_DIR:-/run/user/1000} wl-copy; else xclip -in -selection clipboard; fi'"

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
