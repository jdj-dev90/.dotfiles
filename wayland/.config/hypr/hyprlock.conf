general {
  hide_cursor = true
  grace = 0
}

background {
  monitor =
  path = ~/.wallpapers/synth-kanagawa.png
  color = rgb(1f1f28)
  blur_passes = 3
  blur_size = 6
  brightness = 0.6
}

label {
  monitor =
  text = $TIME
  color = rgb(dcd7ba)
  font_size = 96
  font_family = JetBrainsMono Nerd Font
  position = 0, 160
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:60000] date '+%A %d %B'
  color = rgb(c8c093)
  font_size = 20
  font_family = JetBrainsMono Nerd Font
  position = 0, 60
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 320, 50
  outline_thickness = 2
  rounding = 8
  outer_color = rgb(363646)
  inner_color = rgb(2a2a37)
  font_color = rgb(dcd7ba)
  check_color = rgb(7e9cd8)
  fail_color = rgb(c34043)
  capslock_color = rgb(e6c384)
  placeholder_text = <i>password</i>
  fail_text = <i>$FAIL ($ATTEMPTS)</i>
  fade_on_empty = false
  dots_center = true
  position = 0, -40
  halign = center
  valign = center
}
