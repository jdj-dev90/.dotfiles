# Managed by dotfiles. Docked workspace layout.
workspace = 1, monitor:DP-7
workspace = 2, monitor:DP-7
workspace = 3, monitor:DP-7
workspace = 4, monitor:DP-7
workspace = 5, monitor:DP-6
workspace = 6, monitor:DP-6
workspace = 7, monitor:DP-8
workspace = 8, monitor:DP-8
workspace = 9, monitor:DP-8
workspace = 10, monitor:DP-8

# App homes (new windows only; move them freely afterwards)
windowrule = match:class ^chromium$, workspace 4
windowrule = match:class ^Slack$, workspace 7 silent
