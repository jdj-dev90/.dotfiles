$mod = SUPER

# Kanagawa cursor (vimix-kanagawa-cursors / -hyprcursors, "wave" = dark).
env = HYPRCURSOR_THEME,vimix-kanagawa-hyprcursors-wave
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,vimix-kanagawa-cursors-wave
env = XCURSOR_SIZE,24

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

input {
  kb_layout = au
  kb_options = caps:escape
  repeat_delay = 200
  repeat_rate = 35
  follow_mouse = 1
}

binds {
  workspace_center_on = 1
}

misc {
  # hyprpaper draws the wallpaper; skip Hyprland's built-in default and logo.
  force_default_wallpaper = 0
  disable_hyprland_logo = true
}

cursor {
  no_warps = false
  persistent_warps = true
}

general {
  gaps_in = 0
  gaps_out = 0
  border_size = 2
  # Kanagawa: crystalBlue -> oniViolet active, sumiInk inactive
  col.active_border = rgba(7e9cd8ff) rgba(957fb8ff) 45deg
  col.inactive_border = rgba(363646ff)
}

decoration {
  rounding = 6
  dim_strength = 0.6
  blur {
    enabled = false
  }
}

exec-once = sh -c 'command -v wl-paste >/dev/null && command -v cliphist >/dev/null && wl-paste --type text --watch cliphist store'
exec-once = sh -c 'command -v wl-paste >/dev/null && command -v cliphist >/dev/null && wl-paste --type image --watch cliphist store'
exec-once = systemctl --user reset-failed waybar.service swaync.service; systemctl --user start waybar.service swaync.service audio-defaults.service

bind = $mod, Return, exec, ghostty
bind = $mod, D, exec, wofi --show drun
bind = $mod, O, exec, sh -c 'command -v cliphist >/dev/null && command -v wofi >/dev/null && command -v wl-copy >/dev/null && cliphist list | wofi --dmenu --prompt clipboard | cliphist decode | wl-copy'
bind = $mod, Q, killactive
bind = $mod, Escape, exec, loginctl lock-session

# Media keys (repeat while held, work on the lock screen)
bindel = , XF86MonBrightnessUp, exec, ~/.local/scripts/backlight up
bindel = , XF86MonBrightnessDown, exec, ~/.local/scripts/backlight down
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindl = $mod, M, exec, swayosd-client --input-volume mute-toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# wofi menus (see bin/.local/scripts/menu)
bind = $mod, Space, exec, ~/.local/scripts/menu
bind = $mod SHIFT, E, exec, ~/.local/scripts/menu power
bind = $mod, Tab, exec, ~/.local/scripts/menu windows
bind = $mod, P, exec, ~/.local/scripts/menu projects
bind = $mod, period, exec, ~/.local/scripts/menu emoji
bind = $mod SHIFT, C, exec, ~/.local/scripts/colourpick
bind = $mod, W, exec, ~/.local/scripts/wallpaper next
bind = $mod SHIFT, W, exec, ~/.local/scripts/wallpaper pick

# Screen recording: region / focused monitor; either key again stops it
bind = $mod SHIFT, R, exec, ~/.local/scripts/screenrec region
bind = $mod CTRL, R, exec, ~/.local/scripts/screenrec screen

# Scratchpad terminal: drops over the current workspace, spawned on first use
bind = $mod, grave, togglespecialworkspace, term
workspace = special:term, on-created-empty:ghostty --class=dev.scratch.term
windowrule = match:class ^dev\.scratch\.term$, float on, size 60% 60%, center on
bind = $mod, F, fullscreen

bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r



bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, N, exec, swaync-client -t -sw
bind = $mod SHIFT, N, exec, swaync-client -C
bind = $mod, S, exec, hyprshot -m region -o /home/jordan/.dotfiles/screenshots
# Region screenshot straight into satty to annotate (Enter copies, Ctrl+S saves)
bind = $mod SHIFT, S, exec, hyprshot -m region --raw | satty --filename -
# Copy the text inside a dragged region (OCR)
bind = $mod SHIFT, T, exec, ~/.local/scripts/ocr

# screenshare: SUPER+ALT+S start/stop, 1-6 pick a view, 0 pause, [ ] cycle, Z zoom
bind = $mod ALT, S, exec, ~/.local/scripts/screenshare toggle
bind = $mod ALT, 1, exec, ~/.local/scripts/screenshare scene 1
bind = $mod ALT, 2, exec, ~/.local/scripts/screenshare scene 2
bind = $mod ALT, 3, exec, ~/.local/scripts/screenshare scene 3
bind = $mod ALT, 4, exec, ~/.local/scripts/screenshare scene 4
bind = $mod ALT, 5, exec, ~/.local/scripts/screenshare scene 5
bind = $mod ALT, 6, exec, ~/.local/scripts/screenshare scene 6
bind = $mod ALT, 0, exec, ~/.local/scripts/screenshare scene 0
bind = $mod ALT, bracketleft, exec, ~/.local/scripts/screenshare prev
bind = $mod ALT, bracketright, exec, ~/.local/scripts/screenshare next
bind = $mod ALT, Z, exec, ~/.local/scripts/screenshare zoom

exec-once = sh -c 'command -v hypr-monitor-profile >/dev/null && hypr-monitor-profile'
exec-once = sh -c 'command -v hypr-monitor-watch >/dev/null && hypr-monitor-watch'
exec-once = hypridle
# Packaged user units want graphical-session.target, which this session never
# starts, so start them directly (like waybar above).
exec-once = systemctl --user start hyprpolkitagent.service hyprpaper.service hyprsunset.service
exec-once = swayosd-server
exec-once = ~/.local/scripts/battery-watch
exec-once = udiskie --tray --notify

animations {
  enabled = true
  animation = workspaces, 1, 1, default
  animation = windows, 1, 1, default
  animation = windowsOut, 1, 1, default
}

# Godot game launched from editor (class = project name) -> workspace 9, fullscreen
windowrule = match:class ^Godot BotW$, workspace 9, fullscreen on

# screenshare: invisible output for OBS's program view, out of cursor reach.
monitor = SHARE, 2560x1440@30, 20000x0, 1
workspace = name:share, monitor:SHARE, default:true
windowrule = match:title ^Projector - Program$, workspace name:share silent, fullscreen on

# Password prompts (keyring, polkit): centred modal over a dimmed screen.
windowrule = match:class ^(gcr-prompter|hyprpolkitagent)$, float on, center on, dim_around on, stay_focused on

# Waybar TUI popups (waybar-popup)
windowrule = match:class ^dev\.waybar\..*$, float on, size 1000 600, center on
