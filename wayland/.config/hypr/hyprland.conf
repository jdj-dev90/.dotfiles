$mod = SUPER

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

input {
  kb_layout = au
  kb_options = caps:escape
  repeat_delay = 200
  repeat_rate = 35
  follow_mouse = 1
}

binds {
  workspace_center_on = 1
}

cursor {
  no_warps = false
  persistent_warps = true
}

general {
  gaps_in = 0
  gaps_out = 0
  border_size = 2
  col.active_border = 0xff458588
  col.inactive_border = 0xff3c3836
}

decoration {
  rounding = 6
  blur {
    enabled = false
  }
}

exec-once = sh -c 'command -v wl-paste >/dev/null && command -v cliphist >/dev/null && wl-paste --type text --watch cliphist store'
exec-once = sh -c 'command -v wl-paste >/dev/null && command -v cliphist >/dev/null && wl-paste --type image --watch cliphist store'
exec-once = systemctl --user start waybar.service swaync.service audio-defaults.service

bind = $mod, Return, exec, ghostty
bind = $mod, D, exec, wofi --show drun
bind = $mod, O, exec, sh -c 'command -v cliphist >/dev/null && command -v wofi >/dev/null && command -v wl-copy >/dev/null && cliphist list | wofi --dmenu --prompt clipboard | cliphist decode | wl-copy'
bind = $mod, Q, killactive
bind = $mod, Escape, exec, loginctl lock-session

# Media keys (repeat while held, work on the lock screen)
bindel = , XF86MonBrightnessUp, exec, ~/.local/scripts/backlight up
bindel = , XF86MonBrightnessDown, exec, ~/.local/scripts/backlight down
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen

bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r



bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, N, exec, swaync-client -t -sw
bind = $mod SHIFT, N, exec, swaync-client -C
bind = $mod, S, exec, hyprshot -m region -o /home/jordan/.dotfiles/screenshots

exec-once = sh -c 'command -v hypr-monitor-profile >/dev/null && hypr-monitor-profile'
exec-once = hypridle

animations {
  enabled = true
  animation = workspaces, 1, 1, default
  animation = windows, 1, 1, default
  animation = windowsOut, 1, 1, default
}

# Godot game launched from editor (class = project name) -> workspace 9, fullscreen
windowrule = match:class ^Godot BotW$, workspace 9, fullscreen on

# Waybar TUI popups (waybar-popup)
windowrule = match:class ^dev\.waybar\..*$, float on, size 1000 600, center on
