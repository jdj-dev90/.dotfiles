general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 min: dim the laptop panel
listener {
  timeout = 300
  on-timeout = ~/.local/scripts/backlight dim
  on-resume = ~/.local/scripts/backlight restore
}

# 10 min: lock
listener {
  timeout = 600
  on-timeout = loginctl lock-session
}

# 11 min: displays off
listener {
  timeout = 660
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on && ~/.local/scripts/backlight restore
}

# 30 min: suspend, only when running on battery
listener {
  timeout = 1800
  on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = 0 ] && systemctl suspend
}
