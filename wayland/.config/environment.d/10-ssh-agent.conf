# Use the plain OpenSSH agent, not gnome-keyring's gcr wrapper.
#
# gcr-ssh-agent.socket sets SSH_AUTH_SOCK=%t/gcr/ssh in the systemd user
# environment, which makes every process use gcr. gcr answers a key *listing*
# instantly but blocks forever on a *signing* request while it waits for a
# graphical confirmation. Anything non-interactive -- an Ansible run, a script,
# an agent -- therefore hangs rather than failing. BatchMode=yes does not help:
# the block is in the agent, not in ssh.
#
# Arch ships ssh-agent.socket, which needs this variable set to be usable.
# Read at session start, so a re-login is required after changing it.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
